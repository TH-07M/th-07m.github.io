document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';

    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');

    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // and sender identity (own child frame / direct parent) is checked

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const resourceBlobs = {};

      el.src = u + frag;
    }

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

        }

26px)\">\n    <div style=\"position:relative;max-width:1000px;margin:0 auto\">\n    <svg sc-camel-view-box=\"0 0 1000 1000\" style=\"width:100%;height:auto;display:block;overflow:visible\">\n      <circle cx=\"500\" cy=\"500\" r=\"470\" fill=\"none\" stroke=\"#F2F2F0\" sc-camel-stroke-width=\".5\" opacity=\".05\"><\u002Fcircle>\n      <circle cx=\"500\" cy=\"500\" r=\"330\" fill=\"none\" stroke=\"#F2F2F0\" sc-camel-stroke-width=\".5\" opacity=\".05\"><\u002Fcircle>\n      <circle cx=\"500\" cy=\"500\" r=\"180\" fill=\"none\" stroke=\"#F2F2F0\" sc-camel-stroke-width=\".5\" opacity=\".08\"><\u002Fcircle>\n      <sc-for list=\"{{ web.links }}\" as=\"l\" hint-placeholder-count=\"18\"><path d=\"{{ l.d }}\" fill=\"none\" stroke=\"{{ l.s }}\" sc-camel-stroke-width=\"{{ l.w }}\" sc-camel-stroke-dasharray=\"{{ l.dash }}\" opacity=\"{{ l.o }}\"><\u002Fpath><\u002Fsc-for>\n      <sc-for list=\"{{ web.hubs }}\" as=\"h\" hint-placeholder-count=\"6\">\n        <g>\n          <circle cx=\"{{ h.cx }}\" cy=\"{{ h.cy }}\" r=\"6\" fill=\"#1FC6F2\"><\u002Fcircle>\n          <circle cx=\"{{ h.cx }}\" cy=\"{{ h.cy }}\" r=\"15\" fill=\"none\" stroke=\"#1FC6F2\" sc-camel-stroke-width=\"1\" opacity=\".3\"><\u002Fcircle>\n        <\u002Fg>\n      <\u002Fsc-for>\n      <sc-for list=\"{{ web.nodes }}\" as=\"n\" hint-placeholder-count=\"8\">\n        <rect x=\"{{ n.rx }}\" y=\"{{ n.ry }}\" width=\"26\" height=\"26\" fill=\"#0D0E11\" stroke=\"{{ n.a }}\" sc-camel-stroke-width=\"1\"><\u002Frect>\n      <\u002Fsc-for>\n    <\u002Fsvg>\n    <sc-for list=\"{{ web.hubs }}\" as=\"h\" hint-placeholder-count=\"6\"><span style=\"{{ h.st }}\">{{ h.label }}<\u002Fspan><\u002Fsc-for>\n    <sc-for list=\"{{ web.nodes }}\" as=\"n\" hint-placeholder-count=\"8\"><span style=\"{{ n.numSt }}\">{{ n.num }}<\u002Fspan><\u002Fsc-for>\n    <sc-for list=\"{{ web.nodes }}\" as=\"n\" hint-placeholder-count=\"8\"><span style=\"{{ n.labSt }}\">{{ n.label }}<\u002Fspan><\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;margin-top:clamp(30px,4vh,54px);background:transparent\">\n    <sc-for list=\"{{ method }}\" as=\"m\" hint-placeholder-count=\"4\">\n      <div style=\"background:#090A0C;box-shadow:0 0 0 1px rgba(242,242,240,.09);padding:24px 20px\">\n        <div style=\"font:500 13px/1.35 'IBM Plex Mono',monospace;word-spacing:.16em;letter-spacing:.18em;color:#1FC6F2;margin-bottom:14px\">{{ m.k }}<\u002Fdiv>\n        <div style=\"font:300 21px/1.65 'Inter Tight',sans-serif;color:#A8ABB2;text-wrap:pretty\">{{ m.d }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-sec=\"\" data-sec-num=\"M4\" data-sec-name=\"TRAJECTORY MODEL\" data-screen-label=\"M4 TRAJECTORY\" id=\"trajectory\" style=\"position:relative;z-index:2;padding:clamp(64px,9vh,120px) clamp(20px,4.4vw,72px);border-top:1px solid rgba(242,242,240,.09);background:rgba(242,242,240,.012)\">\n  <div style=\"display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:14px\">\n    <span style=\"font:400 13px/1.35 'IBM Plex Mono',monospace;word-spacing:.16em;letter-spacing:.2em;color:#1FC6F2\">M4<\u002Fspan>\n    <h2 style=\"margin:0;font:300 clamp(31px,3.8vw,54px)/1.04 'Inter Tight',sans-serif;letter-spacing:-.03em;color:#F2F2F0\">Trajectory Model<\u002Fh2>\n    <span style=\"font:400 13px/1.35 'IBM Plex Mono',monospace;word-spacing:.16em;letter-spacing:.18em;color:#767A82;margin-left:auto\">PREDICTIVE ANALYSIS · AS OF 2026.09.22<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"margin:0 0 clamp(30px,4vh,50px);max-width:760px;font:300 22px/1.65 'Inter Tight',sans-serif;color:#8A8E96;text-wrap:pretty\">Each sector's five-year path is decomposed into the macro variables that move it, the micro variables inside the industry, and the leading indicators that will confirm or refute the view first. Scenario weights are analyst judgment built on the sourced data in each dossier. They are not sourced probabilities and are shown so they can be argued with.<\u002Fp>\n\n  <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:clamp(18px,2.4vh,28px)\"><span style=\"font:500 13px/1.35 'IBM Plex Mono',monospace;word-spacing:.16em;letter-spacing:.18em;color:#1FC6F2\">MACRO STATE — THE VARIABLES EVERY SECTOR SHARES<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(242,242,240,.12)\"><\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;margin-bottom:clamp(34px,5vh,60px)\">\n    <sc-for list=\"{{ macroState }}\" as=\"m\" hint-placeholder-count=\"6\">\n      <div style=\"background:#090A0C;box-shadow:0 0 0 1px rgba(242,242,240,.09);padding:18px 18px 16px;min-width:0\">\n        <div style=\"font:500 13px/1.35 'IBM Plex Mono',monospace;word-spacing:.16em;letter-spacing:.18em;color:#6E727A;margin-bottom:8px\">{{ m.k }}<\u002Fdiv>\n        <div style=\"font:300 clamp(22px,2vw,30px)/1.05 'Inter Tight',sans-serif;letter-spacing:-.03em;color:#F2F2F0;margin-bottom:8px\">{{ m.v }}<\u002Fdiv>\n        <div style=\"font:300 15.5px/1.55 'Inter Tight',sans-serif;color:#A8ABB2;text-wrap:pretty;font-size:14px\">{{ m.d }}<\u002Fdiv>\n        <div style=\"margin-top:10px;display:flex;gap:8px;align-items:center\"><span style=\"width:7px;height:7px;background:{{ m.c }}\"><\u002Fspan><span style=\"font:400 12.5px/1.35 'IBM Plex Mono',monospace;letter-spacing:.1em;color:#B4B7BE\">{{ m.dir }}<\u002Fspan><span style=\"margin-left:auto;font:400 12.5px/1 'IBM Plex Mono',monospace;color:#1FC6F2\">{{ m.s }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:clamp(18px,2.4vh,28px)\"><span style=\"font:500 13px/1.35 'IBM Plex Mono',monospace;word-spacing:.16em;letter-spacing:.18em;color:#1FC6F2\">SENSITIVITY MATRIX — DIRECTION OF EFFECT ON EACH SECTOR<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(242,2 x;background:transparent;border-top:1px solid rgba(242,242,240,.09);border-bottom:1px solid rgba(242,242,240,.09)\">\n    <sc-for list=\"{{ monitor }}\" as=\"m\" hint-placeholder-count=\"8\">\n      <div style=\"background:#090A0C;box-shadow:0 0 0 1px rgba(242,242,240,.09);display:grid;grid-template-columns:minmax(160px,240px) 1fr;gap:clamp(14px,3vw,44px);padding:18px 4px;align-items:baseline\">\n        <div style=\"display:flex;align-items:baseline;gap:12px\"><span style=\"font:400 13.5px/1.35 'IBM Plex Mono',monospace;color:{{ m.a }}\">{{ m.n }}<\u002Fspan><span style=\"font:500 20px/1.4 'Inter Tight',sans-serif;letter-spacing:.04em;color:#F2F2F0\">{{ m.k }}<\u002Fspan><\u002Fdiv>\n        <div style=\"font:300 21px/1.6 'Inter Tight',sans-serif;color:#8A8E96\">{{ m.d }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-sec=\"\" data-sec-num=\"M6\" data-sec-name=\"SOURCES\" data-screen-label=\"M6 SOURCES\" id=\"sources\" style=\"position:relative;z-index:2;padding:clamp(64px,9vh,120px) clamp(20px,4.4vw,72px) clamp(80px,12vh,150px);border-top:1px solid rgba(242,242,240,.09);scroll-margin-top:46px\">\n  <div style=\"display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:clamp(28px,4vh,48px)\">\n    <span style=\"font:400 13px/1.35 'IBM Plex Mono',monospace;word-spacing:.16em;letter-spacing:.2em;color:#1FC6F2\">M6<\u002Fspan>\n    <h2 style=\"margin:0;font:300 clamp(31px,3.8vw,54px)/1.04 'Inter Tight',sans-serif;letter-spacing:-.03em;color:#F2F2F0\">Source Ledger<\u002Fh2>\n    <span style=\"font:400 13px/1.35 'IBM Plex Mono',monospace;word-spacing:.16em;letter-spacing:.18em;color:#767A82;margin-left:auto\">57 ENTRIES / S01–S57 · VERIFIED 2026.09.22<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0 clamp(24px,4vw,60px)\">\n    <sc-for list=\"{{ ledger }}\" as=\"l\" hint-placeholder-count=\"12\">\n      <div style=\"display:grid;grid-template-columns:44px 1fr;gap:14px;padding:13px 0;border-bottom:1px solid rgba(242,242,240,.07)\">\n        <span style=\"font:500 13px/1.6 'IBM Plex Mono',monospace;word-spacing:.16em;letter-spacing:.1em;color:#1FC6F2\">{{ l.id }}<\u002Fspan>\n        <span style=\"font:300 20.5px/1.6 'Inter Tight',sans-serif;color:#8A8E96\">{{ l.t }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"margin-top:clamp(34px,5vh,60px);border:1px solid rgba(242,242,240,.11);padding:clamp(20px,2.6vw,32px);max-width:900px\">\n    <div style=\"font:500 13px/1.35 'IBM Plex Mono',monospace;word-spacing:.16em;letter-spacing:.2em;color:#8A8E96;margin-bottom:14px\">DISCLAIMER<\u002Fdiv>\n    <p style=\"margin:0;font:300 21px/1.7 'Inter Tight',sans-serif;color:#7C8088;text-wrap:pretty\">This dossier is educational and informational. It is not investment advice, a recommendation to buy or sell securities or digital assets, or a guarantee of future results. Market-size estimates and long-range forecasts are uncertain and should be treated as scenarios rather than facts. Figures marked DATA TO VERIFY require primary-source confirmation before publication.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-top:44px;padding-top:20px;border-top:1px solid rgba(242,242,240,.09);font:400 13px/1.6 'IBM Plex Mono',monospace;word-spacing:.16em;letter-spacing:.18em;color:#7C8088\">\n    <span>THE NEXT FRONTIER / REV 01<\u002Fspan>\n    <span>EIGHT STRATEGIC SECTORS · 2026–2046<\u002Fspan>\n    <span>END OF DOSSIER<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = { w: 1440 };\n\n  constructor(p){\n    super(p);\n    this.railNum = React.createRef();\n    this.railName = React.createRef();\n    this.railBar = React.createRef();\n    this.railPct = React.createRef();\n    this.navNum = React.createRef();\n    this.navName = React.createRef();\n  }\n\n  componentDidMount(){\n    this.onResize = () => this.setState({ w: window.innerWidth });\n    this.onResize();\n    window.addEventListener('resize', this.onResize);\n\n    const io = new IntersectionObserver((es) => {\n      es.forEach(e => { if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'none'; io.unobserve(e.target); } });\n    }, { threshold: 0.06, rootMargin: '0px 0px -6% 0px' });\n    document.querySelectorAll('[data-reveal]').forEach(el => io.observe(el));\n\n    const secs = [...document.querySelectorAll('[data-sec]')];\n    this.onScroll = () => {\n      const y = window.scrollY + window.innerHeight * 0.32;\n      let cur = secs[0];\n      for (const s of secs) { if (s.offsetTop <= y) cur = s; }\n      if (cur) {\n        if (this.railNum.current) this.railNum.current.textContent = cur.dataset.secNum;\n        if (this.railName.current) this.railName.current.textContent = cur.dataset.secName;\n        if (this.navNum.current) this.navNum.current.textContent = cur.dataset.secNum;\n        if (this.navName.current) this.navName.current.textContent = cur.dataset.secName;\n      }\n      const max = document.documentElement.scrollHeight - window.innerHeight;\n      const p = max > 0 ? Math.min(1, window.scrollY / max) : 0;\n      if (this.railBar.current) this.railBar.current.style.height = (p * 100).toFixed(2) + '%';\n      if (this.railPct.current) this.railPct.current.textContent = String(Math.round(p * 100)).padStart(3, '0');\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    this.onScroll();\n  }\n\n  componentWillUnmount(){\n    window.removeEventListener('resize', this.onResize);\n    window.removeEventListener('scroll', this.onScroll);\n  }\n\n  /* absolute-positioned overlay label over an svg of viewBox W×H */\n  lab(x, y, W, H, a oFixed(1) + ' ' + y1.toFixed(1); };\n    const ticks = [];\n    for (let i = 0; i < 72; i++) {\n      const deg = i * 5, maj = i % 8 === 0, mid = i % 4 === 0;\n      const [x1, y1] = pol(maj ? 130 : mid ? 136 : 140, deg), [x2, y2] = pol(144, deg);\n      ticks.push({ x1: x1.toFixed(1), y1: y1.toFixed(1), x2: x2.toFixed(1), y2: y2.toFixed(1), s: maj ? '#1FC6F2' : '#F2F2F0', w: maj ? 1 : 0.6, o: maj ? 0.7 : mid ? 0.3 : 0.16 });\n    }\n    const arcs = [];\n    for (let i = 0; i < N; i++) { const c = i * 360 / N; arcs.push({ d: arcD(153, c - 14, c + 14), s: accents[i], w: 4, o: 0.6, dash: 'none' }); }\n    arcs.push({ d: arcD(100, -60, 200), s: '#1FC6F2', w: 1.2, o: 0.35, dash: 'none' });\n    arcs.push({ d: arcD(86, 120, 330), s: '#1FC6F2', w: 0.8, o: 0.28, dash: '2 5' });\n    arcs.push({ d: arcD(72, -20, 110), s: '#F2F2F0', w: 0.8, o: 0.22, dash: 'none' });\n    arcs.push({ d: arcD(72, 150, 260), s: '#F2F2F0', w: 0.8, o: 0.22, dash: 'none' });\n    const nonagon = (r, rot) => { let d = ''; for (let i = 0; i < 9; i++) { const [x, y] = pol(r, rot + i * 40); d += (i ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); } return d + ' Z'; };\n    const core = [\n      { d: nonagon(52, 0), f: 'none', s: '#1FC6F2', w: 1, o: 0.55 },\n      { d: nonagon(44, 20), f: 'rgba(31,198,242,.05)', s: '#F2F2F0', w: 0.6, o: 0.35 },\n      { d: nonagon(30, 0), f: '#0D0E11', s: '#1FC6F2', w: 1.2, o: 0.9 },\n      { d: Array.from({ length: 9 }, (_, i) => { const [x0, y0] = pol(30, i * 40), [x1, y1] = pol(52, i * 40); return 'M' + x0.toFixed(1) + ' ' + y0.toFixed(1) + ' L' + x1.toFixed(1) + ' ' + y1.toFixed(1); }).join(' '), f: 'none', s: '#1FC6F2', w: 0.7, o: 0.45 },\n      { d: Array.from({ length: 9 }, (_, i) => { const [x0, y0] = pol(60, i * 40), [x1, y1] = pol(66, i * 40); return 'M' + x0.toFixed(1) + ' ' + y0.toFixed(1) + ' L' + x1.toFixed(1) + ' ' + y1.toFixed(1); }).join(' '), f: 'none', s: '#F2F2F0', w: 0.8, o: 0.4 }\n    ];\n    const stars = [];\n    for (let i = 0; i < 54; i++) s(cx - 500) < 3;\n      const an = mid ? 'middle' : (right ? 'start' : 'end');\n      return { label, cx, cy,\n        st: this.lab(mid ? cx : (right ? cx + 24 : cx - 24), mid ? (cy < 500 ? cy - 28 : cy + 28) : cy, 1000, 1000, an, { font:\"500 clamp(13px,1.25vw,16.5px) 'IBM Plex Mono',monospace\", wordSpacing: '.16em', letterSpacing: '.12em', color: '#C9CBD0' }) };\n    });\n    const webNodes = [];\n    for (let i = 0; i < N; i++) {\n      const ang = -90 + i * 360 / N, rad = ang * Math.PI / 180;\n      const cx = 500 + Math.cos(rad) * 400, cy = 500 + Math.sin(rad) * 400;\n      webNodes.push({ cx, cy, rx: cx - 13, ry: cy - 13, a: accents[i], num: '0' + (i + 1), label: shortNames[i],\n        numSt: this.lab(cx, cy, 1000, 1000, 'middle', { font:\"500 clamp(13px,1.2vw,16px) 'IBM Plex Mono',monospace\", wordSpacing: '.08em', letterSpacing: '.04em', color: accents[i] }),\n        labSt: this.lab(cx, cy + (cy > 500 ? 36 : -36), 1000, 1000, 'middle', { font:\"400 clamp(12.5px,1.1vw,15px) 'IBM Plex Mono',monospace\", wordSpacing: '.08em', letterSpacing: '.08em', color: '#B4B7BE' }) });\n    }\n    const webLinks = linkTable.map(([si, hi, k]) => {\n      const s = webNodes[si], h = webHubs[hi];\n      const mx = (s.cx + h.cx) / 2 + (500 - (s.cx + h.cx) / 2) * 0.18;\n      const my = (s.cy + h.cy) / 2 + (500 - (s.cy + h.cy) / 2) * 0.18;\n      return { d: 'M' + s.cx.toFixed(0) + ' ' + s.cy.toFixed(0) + ' Q' + mx.toFixed(0) + ' ' + my.toFixed(0) + ' ' + h.cx.toFixed(0) + ' ' + h.cy.toFixed(0), s: k === 3 ? '#F2F2F0' : s.a, w: wOf(k), o: oOf(k), dash: k === 3 ? '4 6' : 'none' };\n    });\n\n\n    /* ---- M5 trajectory model ---- */\n    const macroState = [\n      { k: 'U.S. POLICY RATE', v: '3.75–4.00%', d: 'Raised 25 bp on 2026.09.16 by a 12–0 vote, the first hike since July 2023. Inflation is elevated, partly on energy; 16 of 18 dot-plot participants expect another increase.', dir: 'BIAS: TIGHTENING', c: '#EC5B48', s: 'S52' },\n      { k: 'U.S.–CHINA MINERALS TRUCE', v: '2026.11.10', d: 'China’s October-2025 rare-earth controls are suspended only to this date; in June 2026 China listed MP Materials and USA Rare Earth as controlled entities. The April-2025 heavy-rare-earth controls were never suspended.', dir: 'FRAGILE', c: '#E8A33D', s: 'S53' },\n      { k: 'AI CAPEX CYCLE', v: '~$725B', d: 'Big-four 2026 guidance, +77% y/y, increasingly bond-funded. The single largest demand pull on power, minerals, chips and nuclear.', dir: 'ACCELERATING', c: '#37D7B0', s: 'S45' },\n      { k: 'FISCAL / DEFENSE IMPULSE', v: '$1T+ / 5% GDP', d: 'U.S. 2026 defense enactment above $1T; NATO 5%-of-GDP target by 2035. Budgets are political but the direction is set.', dir: 'EXPANDING', c: '#37D7B0', s: 'S33' },\n      { k: 'ENERGY PRICES / SUPPLY SHOCK', v: 'ELEVATED', d: 'The Fed cites Middle East conflict and energy-led supply shocks. Uranium spot ~$90/lb (mid-September); long-term contract prices are at record levels as Kazatomprom cut 2026 capacity.', dir: 'TIGHT', c: '#E8A33D', s: 'S54' },\n      { k: 'RISK APPETITE', v: 'REBUILDING', d: 'Spot-Bitcoin ETFs took $3.5B in August and stayed net positive through mid-September despite the Fed hike; Bitcoin ~$86.6K (2026.09.22). Liquidity is returning but is rate-sensitive.', dir: 'FRAGILE', c: '#E8A33D', s: 'S57' }\n    ];\n    const sensHead = accents.map((a, i) => ({ a, n: ['MIN', 'DEF', 'NUC', 'SPC', 'QNT', 'BIO', 'ROB', 'CRY', 'AI'][i] }));\n    const cell = v => { const map = { 2: ['++', '#37D7B0'], 1: ['+', '#37D7B0'], 0: ['·', '#6E727A'], '-1': ['−', '#EC5B48'], '-2': ['−−', '#EC5B48'] }; const [t, c] = map[String(v)]; return { t, st: { background: '#090A0C', padding: '12px 6px', textAlign: 'center', font: \"500 13px/1.3 'IBM Plex Mono',monospace\", color: c } }; };\n    const sens = [\n      ['INTEREST RATES', [-1, 0, -2, -1, -1, -2, -2, -2, -1]],\n      ['U.S.–CHINA TENSION', [2, 2, 1, 1, 1, 0, -1, 0, -1]],\n      ['AI CAPEX', [2, 1, 2, 1, 1, 0, 1, 0, 2]],\n      ['ENERGY PRICES', [1, 0, 2, 0, 0, 0, -1, -1, -2]],\n      ['DEFENSE BUDGETS', [2, 2, 1, 2, 1, 0, 1, 0, 1]],\n      ['U.S. DOLLAR', [-1, 0, -1, 0, 0, -1, -1, -2, 0]],\n      ['REGULATORY EASING', [1, 1, 2, 1, 0, 2, 1, 2, 1]]\n    ].map(([k, v]) => ({ k, cells: v.map(cell) }));\n    const scen = (k, p, s, tr) => ({ k, p: p + '%', s, tr, c: k === 'BULL' ? '#37D7B0' : k === 'BASE' ? '#F2F2F0' : '#EC5B48', bar: { width: p + '%', background: k === 'BULL' ? '#37D7B0' : k === 'BASE' ? '#8A8E96' : '#EC5B48', opacity: 0.8 } });\n    const traj = [\n      { n: '01', a: accents[0], title: 'Critical Minerals & Rare Earths', call: 'STRUCTURAL TIGHTENING',\n        thesis: 'Processing, not ore, sets the path. Three dated forcing events sit inside 14 months: the 2026.11.10 expiry of China’s export-control pause, the 2027.01.01 EO 14415 waiver restriction, and continuing entity listings on both sides. Demand from defense, grid and AI data centres is inelastic to price in the near term, so the constraint shows up as price and lead time before it shows up as new supply.',\n        macro: ['U.S.–China trade posture: the truce is a date, not a settlement. [S53]', 'Defense and grid capex are price-insensitive buyers of magnets and copper. [S05][S33]', 'Higher rates slow the mine-and-refinery pipeline that would relieve the squeeze.'],\n        micro: ['Western magnet and separation capacity arrives 2027–29; until then China holds ~90% of processing.', 'Government equity, loans and offtakes now set project economics, not spot price.', 'IEA: pipeline additions have narrowed projected copper and lithium gaps. [S05]'],\n        ind: [{ k: 'MOFCOM ACTIONS BEFORE 2026.11.10', w: 'Extension, lapse, or a new list decides Q4.' }, { k: 'NdPr AND DYSPROSIUM EX-CHINA PREMIUM', w: 'Widening spread = bifurcated market.' }, { k: 'DoD / DOE OFFTAKE ANNOUNCEMENTS', w: 'Each one de-risks a project the market would not fund alone.' }],\n        sc: [scen('BULL', 30, 'Controls lapse or tighten; ex-China prices decouple; funded projects re-rate.', 'No extension of the November pause.'), scen('BASE', 50, 'Truce rolls forward; two-tier pricing persists; slow Western buildout with policy support.', 'Pause extended 6–12 months.'), scen('BEAR', 20, 'Broad détente or demand slump; Chinese supply floods back; marginal Western projects stall.', 'Comprehensive trade deal or recession.')],\n        flip: 'A durable U.S.–China minerals agreement with licensing normalised for 24+ months, or evidence that Western processing capacity is arriving faster than 2027–29.' },\n      { n: '02', a: accents[1], title: 'Defense & Autonomous Systems', call: 'FUNDED CYCLE',\n        thesis: 'Spending is the most certain variable in this report: an 11th consecutive global increase, a U.S. budget above $1T and a NATO 5% target. The open question is mix. The base case is that autonomy and counter-drone budgets grow faster than the total while primes keep most of the dollars; the risk is that autonomy stays a rounding error inside platform budgets.',\n        macro: ['Fiscal capacity: $1.5T proposed for U.S. FY2027; allied budgets rising toward 5%. [S33][S08]', 'Conflict intensity sets urgency; active Middle East conflict is a current driver.', 'Rates matter less here: the customer is sovereign.'],\n        micro: ['Munitions, propulsion, electronics and workforce are the production bottlenecks.', 'Software-defined and attritable systems compress procurement cycles.', 'Export-control and industrial-base rules favour domestic and allied suppliers.'],\n        ind: [{ k: 'AUTONOMY SHARE OF PROCUREMENT', w: 'Program-of-record awards, not demos.' }, { k: 'MUNITIONS OUTPUT RATES', w: 'Throughput is the tell for the industrial base.' }, { k: 'NATO 5% IMPLEMENTATION PLANS', w: 'National budgets translating the target into law.' }],\n        sc: [scen('BULL', 30, 'Autonomy becomes a budget line; new entrants win programs of record; capacity expands.', 'Multi-billion autonomy awards outside primes.'), scen('BASE', 55, 'Budgets grow; primes absorb most; autonomy grows fast from a small base.', 'Continued enactments near guidance.'), scen('BEAR', 15, 'Fiscal stress or ceasefires cut growth; procurement reverts to legacy.', 'Debt-driven budget cap or broad de-escalation.')],\n        flip: 'A U.S. budget resolution that flattens defense in real terms, or NATO members visibly missing interim spending milestones.' },\n      { n: '03', a: accents[2], title: 'Nuclear Energy & Uranium', call: 'DEMAND CONFIRMED, DELIVERY UNPROVEN',\n        thesis: 'The demand side is now underwritten by AI power needs, federal loan capacity and record long-term uranium contracting. Regulatory time has compressed: the first non-light-water construction permit in 40 years took under 18 months of technical review. The trajectory therefore hinges on construction execution and fuel-cycle capacity, neither of which has been tested at scale.',\n        macro: ['Power demand: data centres ~half of U.S. load growth to 2030. [S44]', 'Public balance sheet: $17.5B DOE conditional commitment. [S34]', 'Rates are the main headwind for capital-intensive builds; the Fed resumed hiking in September. [S52]'],\n        micro: ['NRC: Kemmerer Unit 1 permit 2026.03.04; NuScale US460 design approved. [S56]', 'Uranium: spot ~$90/lb, long-term at record highs; U.S. output far below consumption. [S54][S14]', 'HALEU and enrichment capacity gate advanced designs.'],\n        ind: [{ k: 'FIRST-OF-A-KIND COST VARIANCE', w: 'Kemmerer’s $4.0B estimate is unchanged since 2021.' }, { k: 'UTILITY LONG-TERM CONTRACT VOLUME', w: 'Confirms the fuel deficit is being priced.' }, { k: 'HYPERSCALER PPAs WITH NUCLEAR', w: 'Direct demand underwriting.' }],\n        sc: [scen('BULL', 25, 'Uprates and restarts deliver; first SMRs on schedule; uranium re-rates above $100 long-term.', 'On-budget FOAK milestones 2027–28.'), scen('BASE', 50, 'Existing fleet extends; SMRs slip 1–3 years but proceed; fuel prices firm.', 'Typical FOAK slippage.'), scen('BEAR', 25, 'Cost overruns and rate pressure stall new build; gas takes the data-centre load.', 'Major project cancellation or cost blowout.')],\n        flip: 'A first-of-a-kind SMR delivered on budget would raise the bull case sharply; a Vogtle-scale overrun on any flagship project would cut it.' },\n      { n: '04', a: accents[3], title: 'Space Economy', call: 'COST CURVE INTACT',\n        thesis: 'Launch cost is falling on schedule and defense-space demand is rising; the sourced 40% cost reduction by 2035 remains the spine of the thesis. Value is migrating downstream to connectivity, observation and defense communications. The main risk is not launch but overbuilt satellite capacity against paying demand.',\n        macro: ['Defense budgets fund resilient space, the fastest-growing government demand. [S33]', 'Rates hit pre-revenue constellation builders hardest.', 'Spectrum and debris policy are slow but binding.'],\n        micro: ['Heavy-lift reusable cadence and reliability set the cost curve. [S15]', 'Direct-to-device connectivity opens consumer-scale revenue.', 'In-orbit servicing remains a unit-economics question, not a feasibility one.'],\n        ind: [{ k: 'LAUNCH CADENCE AND FAILURE RATE', w: 'Cost per kg follows reliability.' }, { k: 'DEFENSE-SPACE CONTRACT AWARDS', w: 'The sovereign customer sets the floor.' }, { k: 'CONSTELLATION UTILISATION', w: 'Revenue per satellite, not satellites launched.' }],\n        sc: [scen('BULL', 25, 'Cost falls faster than forecast; D2D and defense comms scale; launch backlog verified above $500B.', 'Heavy-lift enters routine service.'), scen('BASE', 55, 'On the McKinsey path: −40%/kg by 2035, $32B launch revenue. [S15]', 'Cadence rises steadily.'), scen('BEAR', 20, 'Failures or debris events slow cadence; constellation revenue disappoints.', 'Loss-of-vehicle events or spectrum disputes.')],\n        flip: 'Two consecutive years of flat launch cost per kilogram, or a debris or spectrum ruling that caps constellation deployment.' },\n      { n: '05', a: accents[4], title: 'Quantum Computing', call: 'OPTION VALUE, NOT CASH FLOW',\n        thesis: 'Quantum remains pre-commercial. The credible 2028–30 window for early fault-tolerant machines is a forecast, and the surest near-term revenue is defensive: post-quantum cryptography migration. Trajectory depends almost entirely on logical-qubit error-correction milestones, which are binary and hard to time.',\n        macro: ['National-security funding sustains the field through the trough.', 'Rates and risk appetite govern private funding for pre-revenue vendors.', 'AI capex competes for the same engineering talent and fab capacity.'],\n        micro: ['Logical qubit counts and error rates are the only metrics that matter. [S17]', 'Cloud access is the commercial channel; hardware sales are small.', 'PQC migration mandates create revenue independent of hardware progress. [S18]'],\n        ind: [{ k: 'LOGICAL-QUBIT DEMONSTRATIONS', w: 'Tens to hundreds with error correction.' }, { k: 'GOVERNMENT PQC DEADLINES', w: 'Migration spending is near-term and certain.' }, { k: 'VENDOR FUNDING ROUNDS', w: 'Down-rounds signal a longer trough.' }],\n        sc: [scen('BULL', 20, 'Early fault-tolerant systems by 2029 on chemistry and materials; market toward the top of the $7–10B 2030 range. [S17]', 'Verified logical-qubit milestones 2027–28.'), scen('BASE', 50, 'Steady progress; useful advantage on narrow problems by 2030–32; PQC is the revenue.', 'Incremental error-correction gains.'), scen('BEAR', 30, 'Error correction stalls; funding thins; consolidation.', 'Missed roadmaps for two years.')],\n        flip: 'A peer-reviewed, reproducible commercial advantage on a real problem would move this to an active thesis; a second missed roadmap cycle would move it to watch-only.' },\n      { n: '06', a: accents[5], title: 'Medical Biotechnology & Gene Editing', call: 'PLATFORM PROVEN, ECONOMICS NOT',\n        thesis: 'The science is validated: approved CRISPR therapies exist and uptake is measurable. The trajectory question has shifted to manufacturing cost, reimbursement and in-vivo delivery. This is the sector most exposed to interest rates (long-duration cash flows) and to regulatory posture, and least exposed to U.S.–China trade.',\n        macro: ['Rates: long-duration cash flows make biotech the most rate-sensitive sector here.', 'Payer budgets and drug-pricing policy determine uptake speed.', 'Demographics: ageing populations are a durable demand base.'],\n        micro: ['Ex-vivo therapies are cost-limited; in-vivo delivery is the unlock.', 'Trial readouts and safety events are binary, dated catalysts.', 'Manufacturing scale-up and treatment-centre capacity gate patient volume.'],\n        ind: [{ k: 'PATIENTS TREATED PER QUARTER', w: 'Uptake is the proof of reimbursement.' }, { k: 'IN-VIVO EDITING TRIAL READOUTS', w: 'Delivery is the platform expansion.' }, { k: 'FDA REVIEW TIMELINES', w: 'Agency capacity and posture.' }],\n        sc: [scen('BULL', 25, 'In-vivo editing succeeds in mid-size indications; costs fall; approvals accelerate.', 'Positive pivotal in-vivo data 2027–28.'), scen('BASE', 50, 'Steady approvals in rare disease; uptake limited by price and capacity.', 'Current trajectory holds.'), scen('BEAR', 25, 'Safety event or pricing action; funding dries up for early-stage platforms.', 'Serious adverse event or major price control.')],\n        flip: 'A serious safety signal in an approved editing therapy, or a U.S. pricing regime that caps one-time curative therapies below cost of goods.' },\n      { n: '07', a: accents[6], title: 'Humanoid Robotics & Physical AI', call: 'PRODUCTION STARTED; ECONOMICS UNKNOWN',\n        thesis: 'The sector crossed from demo to low-volume production in 2026: Figure passed 1,000 units, Tesla began its Fremont ramp, and Chinese makers shipped roughly 97% of first-half global volume. The next five years are decided by cost per deployed hour and uptime in paid deployments, not by unit counts, which are the least reliable numbers in this report.',\n        macro: ['Labour scarcity and wage inflation are the demand case.', 'U.S.–China competition: China leads volume and targets 10,000 deployed robots by 2027. [S55]', 'Rare-earth magnets and actuator supply chains run through the minerals sector.'],\n        micro: ['Actuator, harmonic-drive and hand-dexterity costs dominate the bill of materials.', 'Fleet-level uptime and safety incidents determine repeat orders.', 'Public-market access remains limited; value sits in private rounds. [S24]'],\n        ind: [{ k: 'PAID DEPLOYMENT HOURS', w: 'Figure 1,250+ h at BMW; Agility 65,000+ h across nine sites. [S55]' }, { k: 'COST PER UNIT AND PER HOUR', w: 'Tesla’s $20–30K target is a claim, not a price.' }, { k: 'SECOND-CUSTOMER ORDERS', w: 'Repeat purchase is the only adoption proof.' }],\n        sc: [scen('BULL', 25, 'Cost per hour undercuts labour in logistics by 2029; fleets scale; forecasts near BofA’s 1.2M units by 2030. [S25]', 'Verified repeat orders in the thousands.'), scen('BASE', 50, 'Tens of thousands of units a year by 2030, mostly China; Western programs profitable in niches.', 'Pilots convert slowly.'), scen('BEAR', 25, 'Uptime and cost disappoint; pilots end quietly; funding contracts.', 'Public cancellations by anchor customers.')],\n        flip: 'Audited fleet uptime and cost-per-hour data from an anchor customer, in either direction. Until then every shipment figure should be treated as unverified.' },\n      { n: '08', a: accents[7], title: 'Cryptocurrency & Tokenized Financial Infrastructure', call: 'INFRASTRUCTURE ADVANCING, PRICE DIVERGING',\n        thesis: 'Regulation is moving in one direction: GENIUS is law, DTC has tokenization relief, and CLARITY failed Senate cloture on 2026.09.15, so market structure now runs through agency rule-making. Market liquidity is moving separately: ETFs saw $4.9B of Q2 outflows then the year’s best month in August, with Bitcoin still below its October 20
