        e.target.tagName, String(e.target.src || e.target.href || ''));

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends

    // artifact, so window.top can be a FOREIGN document — a top-addressed

    // opaque contexts — file:// — everything serializes as 'null', where

      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;

      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        // relays are dropped rather than remembered.

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

    // consumers read these Blobs directly. Survives the swap like the error sink.

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

dius:50%;background:#07090b;border:1px solid #7fe3f5;box-shadow:0 0 12px rgba(127,227,245,.8)}\n@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100vh)}}\n@keyframes flicker{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.6}94%{opacity:1}}\n@keyframes spin{to{transform:rotate(360deg)}}\n@keyframes spinr{to{transform:rotate(-360deg)}}\n@keyframes sweep{to{transform:rotate(360deg)}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div ref=\"{{ rootRef }}\" data-screen-label=\"GB200 Breakdown\" style=\"position:relative;width:100%;min-height:100vh;background:radial-gradient(ellipse 70% 60% at 50% 45%, #10161b 0%, #07090b 70%);overflow:clip;display:grid;grid-template-columns:{{ gridCols }};grid-template-rows:{{ gridRows }};gap:{{ gridGap }};padding:24px 28px 20px;\">\n\n  <!-- scanline overlay -->\n  <div style=\"position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg, rgba(255,255,255,0) 0 2px, rgba(0,0,0,.28) 2px 4px);mix-blend-mode:multiply;opacity:.9\"><\u002Fdiv>\n  <div style=\"position:absolute;left:0;right:0;height:120px;pointer-events:none;background:linear-gradient(180deg, rgba(127,227,245,0) 0%, rgba(127,227,245,.07) 50%, rgba(127,227,245,0) 100%);animation:scan 9s linear infinite\"><\u002Fdiv>\n\n  <!-- header -->\n  <div style=\"grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2;\">\n    <div style=\"display:flex;flex-direction:column;gap:6px\">\n      <div style=\"font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.18em;color:#7fe3f5;text-transform:uppercase\">// Component Teardown &nbsp;·&nbsp; NVIDIA GB200<\u002Fdiv>\n      <h1 style=\"margin:0;font-weight:400;font-size:30px;line-height:1.05;letter-spacing:-.01em;color:#eef5f7\">Grace Blackwell <span style=\"font-weight:300;color:#8fa3ab\">Superchip<\u002Fspan><\u002Fh1>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px 22px;white-space:nowrap;flex-shrink:0;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.12em;color:#8fa3ab;text-transform:uppercase;text-align:right\">\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><span>Transistors<\u002Fspan><span style=\"color:#eef5f7;font-size:14px\">208 B <span style=\"color:#5d6f77\">/ GPU<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><span>Process<\u002Fspan><span style=\"color:#eef5f7;font-size:14px\">TSMC 4NP<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><span>Die Temp<\u002Fspan><span style=\"color:#eef5f7;font-size:14px\">{{ tel.temp }} <span style=\"color:#5d6f77\">°C<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><span>HBM Traffic<\u002Fspan><span style=\"color:#eef5f7;font-size:14px\">{{ tel.bw }} <span style=\"color:#5d6f77\">TB/s<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:4px\"><span>Scan Mode<\u002Fspan><span style=\"color:#7fe3f5;font-size:14px;animation:flicker 6s infinite\">{{ modeLabel }}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- left: layer index -->\n  <div style=\"position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;grid-area:{{ indexArea }};background:transparent;padding:6px 0;margin-top:40px;align-self:center\">\n        <sc-for list=\"{{ layers }}\" as=\"l\" hint-placeholder-count=\"7\">\n      <div sc-camel-on-mouse-enter=\"{{ l.hover }}\" sc-camel-on-mouse-leave=\"{{ unhover }}\" sc-camel-on-click=\"{{ l.select }}\" style=\"display:grid;grid-template-columns:28px minmax(0,1fr);gap:0 8px;align-items:baseline;padding:7px 12px;border-left:1px solid {{ l.borderColor }};background:{{ l.bg }};cursor:pointer;transition:all .25s ease\">\n        <span style=\"font-family:'Geist Mono',monospace;font-size:11px;color:{{ l.numColor }}\">{{ l.num }}<\u002  c.tempColor }};white-space:nowrap;line-height:1;opacity:{{ c.tempOpacity }};transition:opacity .3s\">{{ c.tempLabel }}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n            <!-- corner marks -->\n            <div style=\"position:absolute;left:-1px;top:-1px;width:8px;height:8px;border-left:1px solid #bff3fb;border-top:1px solid #bff3fb\"><\u002Fdiv>\n            <div style=\"position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;border-right:1px solid #bff3fb;border-bottom:1px solid #bff3fb\"><\u002Fdiv>\n          <\u002Fdiv>\n          <!-- thickness -->\n          <div style=\"position:absolute;left:0;right:0;bottom:0;height:{{ p.thick }}px;transform-origin:bottom;transform:rotateX(-90deg);background:{{ p.side }};border-left:1px solid {{ p.stroke }};border-right:1px solid {{ p.stroke }}\"><\u002Fdiv>\n          <div style=\"position:absolute;top:0;bottom:0;right:0;width:{{ p.thick }}px;transform-origin:right;transform:rotateY(90deg);background:{{ p.side }};border-top:1px solid {{ p.stroke }};border-bottom:1px solid {{ p.stroke }}\"><\u002Fdiv>\n          <!-- floating label -->\n          <div style=\"position:absolute;right:-14px;top:50%;transform:rotateZ(32deg) rotateX(-58deg) translateX(100%) translateY(-50%);transform-origin:left center;pointer-events:none;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.14em;color:{{ p.labelColor }};white-space:nowrap;display:flex;align-items:center;gap:8px;opacity:{{ p.labelOpacity }};transition:opacity .3s\">\n            <span style=\"display:block;width:26px;height:1px;background:{{ p.labelColor }}\"><\u002Fspan>{{ p.num }} {{ p.short }}\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- right: detail panel -->\n  <div style=\"position:relative;z-index:2;display:flex;flex-direction:column;justify-content:flex-start;min-width:0;grid-area:{{ panelArea }};margin-top:40px\">\n    <div style=\"position:relative;border:1px solid {{ panelBorder }};background:rgba(12,18,22,.75);padding:{{ panelPad }};backdrop-filter:blur(6px);box-shadow:{{ panelGlow }};transition:all .35s ease\">\n      <div style=\"position:absolute;left:-1px;top:-1px;width:12px;height:12px;border-left:1px solid #7fe3f5;border-top:1px solid #7fe3f5\"><\u002Fdiv>\n      <div style=\"position:absolute;right:-1px;top:-1px;width:12px;height:12px;border-right:1px solid #7fe3f5;border-top:1px solid #7fe3f5\"><\u002Fdiv>\n      <div style=\"position:absolute;left:-1px;bottom:-1px;width:12px;height:12px;border-left:1px solid #7fe3f5;border-bottom:1px solid #7fe3f5\"><\u002Fdiv>\n      <div style=\"position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-right:1px solid #7fe3f5;border-bottom:1px solid #7fe3f5\"><\u002Fdiv>\n\n      <div style=\"display:flex;justify-content:space-between;align-items:center;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.18em;color:#7fe3f5;text-transform:uppercase\">\n        <span>{{ active.id }}<\u002Fspan><span style=\"color:#5d6f77\">{{ active.status }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;width:54px;height:54px;border-radius:50%;border:1px solid rgba(127,227,245,.6);display:flex;align-items:center;justify-content:center;font-family:'Geist Mono',monospace;font-size:16px;color:#eef5f7;box-shadow:0 0 18px rgba(127,227,245,.25) inset\">{{ active.num }}<\u002Fdiv>\n      <h2 style=\"margin:14px 0 0;font-size:20px;font-weight:500;line-height:1.15;color:#eef5f7;text-wrap:pretty\">{{ active.name }}<\u002Fh2>\n      <p style=\"margin:8px 0 0;font-size:13px;line-height:1.45;color:#a6b6bd;text-wrap:pretty\">{{ active.desc }}<\u002Fp>\n      <div style=\"margin-top:18px;height:1px;background:repeating-linear-gradient(90deg, rgba(127,227,245,.5) 0 3px, transparent 3px 7px)\"><\u002Fdiv>\n      <div style=\"margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px\">\n        <sc-for list=\"{{ active.specs }}\" as=\"s\" hint-placeholder-count r:#7fe3f5;white-space:nowrap\">{{ pt.v }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ hasSelection }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ clearSelection }}\" style=\"margin-top:20px;width:100%;padding:10px 12px;background:transparent;border:1px solid rgba(127,227,245,.5);color:#7fe3f5;font-family:'Geist Mono',monospace;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer\" style-hover=\"background:rgba(127,227,245,.1)\">← Back To Full Stack<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ noSelection }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:20px;font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.14em;color:#5d6f77;text-transform:uppercase\">Click A Layer To Isolate It<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- bottom: explode control -->\n  <div style=\"grid-column:1/-1;grid-row:-2;position:relative;z-index:2;display:flex;align-items:center;gap:20px;padding-top:12px\">\n    <span style=\"font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.18em;color:#7fe3f5;text-transform:uppercase;white-space:nowrap\">Assembled<\u002Fspan>\n    <div style=\"position:relative;flex:1;min-width:0;display:flex;flex-direction:column;gap:6px\">\n      <div style=\"display:flex;justify-content:space-between;padding:0 2px\">\n        <sc-for list=\"{{ ticks }}\" as=\"t\" hint-placeholder-count=\"11\"><span style=\"width:1px;height:{{ t.h }}px;background:rgba(127,227,245,.45)\"><\u002Fspan><\u002Fsc-for>\n      <\u002Fdiv>\n      <input type=\"range\" min=\"0\" max=\"100\" value=\"{{ explode }}\" sc-camel-on-change=\"{{ onSlide }}\" sc-camel-on-input=\"{{ onSlide }}\" aria-label=\"Explode stack\">\n    <\u002Fdiv>\n    <span style=\"font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.18em;color:#7fe3f5;text-transform:uppercase;white-space:nowrap\">Exploded<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\n// Module footprint (620×250). Left→right like the real board: Grace CPU ringed by LPDDR5X, two B200 packages, NVLink connectors on the right edge. Coords in %.\nconst A='#7fe3f5', C=(o)=>`rgba(127,227,245,${o})`, O=(o)=>`rgba(255,138,76,${o})`;\nconst GRACE={x:5,y:22,w:14,h:56};\nconst LPDDR=[0,1,2,3].flatMap(i=>[{x:5+i*3.6,y:8,w:3,h:10},{x:5+i*3.6,y:82,w:3,h:10}]).concat([0,1,2].map(i=>({x:1,y:24+i*18,w:2.6,h:14})));\nconst PKG=[{x:26,y:8,w:29,h:84},{x:58,y:8,w:29,h:84}];\nconst DIES=PKG.flatMap((p,g)=>[0,1].map(d=>({x:p.x+p.w*(0.31+d*0.195),y:p.y+p.h*0.2,w:p.w*0.185,h:p.h*0.6,label:`B200 · DIE ${d}`})));\nconst HBM=PKG.flatMap((p)=>[0,1,2,3].flatMap(i=>[{x:p.x+p.w*0.06,y:p.y+p.h*(0.06+i*0.225),w:p.w*0.2,h:p.h*0.19,label:'HBM3E'},{x:p.x+p.w*0.74,y:p.y+p.h*(0.06+i*0.225),w:p.w*0.2,h:p.h*0.19,label:'HBM3E'}]));\nconst NVL=[0,1,2,3].map(i=>({x:91.5,y:8+i*21.5,w:7,h:18}));\nconst chip=(c,extra={})=>({x:0,y:0,w:10,h:10,r:0,label:'',fill:C(.08),stroke:C(.4),shadow:'none',textColor:C(.75),temp:null,...c,...extra});\n// nominal operating temps (°C) per part class under load; jittered live in renderVals\nconst T={die:72,grace:58,hbm:64,lpddr:46,nvl:41,vrm:69,plate:38,coolant:45,interposer:66,substrate:55};\n\nconst LAYERS = [\n  { id:'GB-L01', num:'01', short:'COLD PLATE', name:'Liquid Cold Plates', tag:'Thermal · Copper · Coolant In/Out', ix:0, iy:0, thick:14,\n    desc:'A direct-to-chip liquid cooling plate covers the whole module, pulling heat from both Blackwell packages and the Grace CPU so the superchip can sustain its full power envelope in a dense rack.',\n    specs:[{k:'TDP (Superchip)',v:'Up To 2,700 W'},{k:'Cooling',v:'Direct Liquid'},{k:'Material',v:'Copper Cold Plate'},{k:'Rack',v:'NVL72 · 120 kW'}],\n    chips:[chip({x:23,y:3,w:66,h:94,fill:'repeating-linear-gradient(0deg, '+C(.10)+' 0 2px, transparent 2px 9px)',stroke:C(.35),label:'GPU COLD PLATE',temp:T.plate}),\n      chip({x:2,y:14,w:19,h:72,fill:'repeating-linear-gradient(0deg, '+C(.10)+' 0 2px, transparent 2px 9px)',stroke:C(.35),label:'CPU COLD PLATE',temp:T.plate-2}),\n      chip({x:24,y:0,w:64,h:2.2,r:2,fill:C(.18),stroke:C(.5)}),chip({x:24,y:97.5,w:64,h:2.2,r:2,fill:C(.18),stroke:C(.5)}),\n      chip({x:88.5,y:26,w:2.4,h:12,r:8,fill:C(.05),stroke:C(.6)}),chip({x:88.5,y:62,w:2.4,h:12,r:8,fill:C(.05),stroke:C(.6)}),\n      chip({x:40,y:44,w:30,h:10,label:'GB200 · NVL72 · LIQUID COOLED',fill:'transparent',stroke:'transparent',textColor:C(.6)})] },\n  { id:'GB-L02', num:'02', short:'GPU DIES', name:'Blackwell GPU Dies & Grace CPU', tag:'Compute · 2 × Reticle-Limit Per GPU', ix:0, iy:0, thick:6,\n    desc:'Each Blackwell GPU is built from two reticle-sized dies fused into one. A 10 TB/s NV-HBI link between them lets software treat the pair as a single, fully coherent chip. The 72-core Grace CPU sits beside them on the same module.',\n    specs:[{k:'Transistors',v:'208 B / GPU'},{k:'Process',v:'TSMC 4NP'},{k:'Die-To-Die',v:'10 TB/s NV-HBI'},{k:'FP4 Dense',v:'~10 PFLOPS / GPU'}],\n    chips:[...PKG.map(p=>chip(p,{fill:'transparent',stroke:C(.18)})), chip(GRACE,{fill:'transparent',stroke:C(.18)}),\n      ...DIES.map((d,i)=>chip(d,{fill:C(.16),stroke:C(.8),shadow:'0 0 10px '+C(.35),temp:T.die+(i%2)*1.5})),\n      ...PKG.map(p=>chip({x:p.x+p.w*0.497,y:p.y+p.h*0.24,w:p.w*0.012,h:p.h*0.52,fill:'#bff3fb',stroke:'transparent',shadow:'0 0 6px '+C(.9)})),\n      chip({x:GRACE.x+3.5,y:GRACE.y+16,w:7,h:24,label:'GRACE',fill:C(.14),stroke:C(.8),shadow:'0 0 10px '+C(.35),temp:T.grace})] },\n  { id:'GB-L03', num:'03', short:'SM / TENSOR', name:'Streaming Multiprocessors & Tensor Cores', tag:'Inside The Die · 5th-Gen Tensor', ix:0, iy:0, thick:3,\n    desc:'Each die is tiled with streaming multiprocessors arranged in GPCs. Fifth-generation Tensor Cores add FP4 and FP6 precisions, and the second-generation Transformer Engine picks per-layer precision on the fly.',\n    specs:[{k:'Tensor Cores',v:'5th Generation'},{k:'New Precisions',v:'FP4 · FP6'},{k:'Engine',v:'Transformer Engine v2'},{k:'Decompression',v:'800 GB/s'}],\n    chips:[...DIES.map(d=>chip(d,{fill:'transparent',stroke:C(.35)})),\n      ...DIES.flatMap(d=>Array.from({length:8},(_,i)=>chip({x:d.x+d.w*(0.08+(i%2)*0.5),y:d.y+d.h*(0.05+Math.floor(i/2)*0.235),w:d.w*0.4,h:d.h*0.19,fill:C(.22),stroke:C(.7)}))),\n      ...DIES.map(d=>chip({x:d.x+d.w*0.46,y:d.y+d.h*0.05,w:d.w*0.08,h:d.h*0.9,fill:C(.06),stroke:C(.25)}))] },\n  { id:'GB-L04', num:'04', short:'HBM3E', name:'HBM3e Memory Stacks', tag:'Memory · 8 Stacks Per GPU', ix:0, iy:0, thick:9,\n    desc:'Eight stacks of HBM3e flank the two dies of each GPU, four per side. Memory sits millimetres from compute, which is what gives Blackwell its bandwidth for trillion-parameter models. Grace uses LPDDR5X around its package.',\n    specs:[{k:'Capacity',v:'Up To 192 GB / GPU'},{k:'Bandwidth',v:'8 TB/s'},{k:'Stacks',v:'8 × HBM3e'},{k:'Superchip Total',v:'384 GB HBM3e'}],\n    chips:[...PKG.map(p=>chip(p,{fill:'transparent',stroke:C(.18)})), chip(GRACE,{fill:'transparent',stroke:C(.18)}),\n      ...DIES.map(d=>chip(d,{fill:'transparent',stroke:C(.2)})),\n      ...HBM.map((s,i)=>chip(s,{fill:'repeating-linear-gradient(0deg, '+C(.22)+' 0 1px, transparent 1px 3px)',stroke:C(.8),textColor:'#bff3fb',temp:T.hbm+((i*7)%5)-2})),\n      ...LPDDR.map((m,i)=>chip(m,{fill:C(.14),stroke:C(.6),temp:T.lpddr+(i%3)}))] },\n  { id:'GB-L05', num:'05', short:'INTERPOSER', name:'CoWoS-L Silicon Interposer', tag:'Packaging · 2.5D', ix:0, iy:0, thick:4,\n    desc:'Under each GPU, a silicon interposer with local interconnect bridges carries the ultra-dense wiring between the dies and the HBM stacks — the packaging step that makes the two-die design possible.',\n    specs:[{k:'Technology',v:'TSMC CoWoS-L'},{k:'Bridges',v:'LSI Chiplets'},{k:'Wiring Pitch',v:'Sub-Micron'},{k:'Role',v:'Die ↔ HBM Fabric'}],\n    chips:[...PKG.map(p=>chip({x:p.x+1.2,y:p.y+3,w:p.w-2.4,h:p.h-6,fill:'repeating-linear-gradient(90deg, '+C(.14)+' 0 1px, transparent 1px 5px)',stroke:C(.6),label:'COWOS-L',temp:T.interposer})),\n      ...PKG.map(p=>chip({x:p.x+p.w*0.485,y:p.y+p.h*0.22,w:p.w*0.035,h:p.h*0.56,fill:C(.3),stroke:C(.9)})),\n      chip({x:GRACE.x+1.5,y:GRACE.y+4,w:GRACE.w-3,h:GRACE.h-8,fill:'transparent',stroke:C(.25)})] },\n  { id:'GB-L06', num:'06', short:'SUBSTRATE', name:'Package Substrate & Module PCB', tag:'Organic Laminate · BGA', ix:0, iy:0, thick:10,\n    desc:'Organic substrates spread each interposer\\u2019s fine bumps out to a board-scale ball grid, and the module PCB routes power, NVLink and C2C signals between the three packages and off the board.',\n    specs:[{k:'Type',v:'Organic Laminate'},{k:'Interface',v:'BGA To Module'},{k:'Signals',v:'NVLink · C2C · PCIe'},{k:'Layers',v:'Multi-Layer Build-Up'}],\n    chips:[chip({x:0.5,y:1,w:99,h:98,fill:C(.02),stroke:C(.15)}),\n      ...PKG.map(p=>chip(p,{fill:'repeating-radial-gradient(circle at 1px 1px, '+C(.22)+' 0 1px, transparent 1px 6px)',stroke:C(.55),label:'BGA',temp:T.substrate})),\n      chip(GRACE,{fill:'repeating-radial-gradient(circle at 1px 1px, '+C(.22)+' 0 1px, transparent 1px 6px)',stroke:C(.55),label:'BGA',temp:T.substrate-6}),\n      ...[0,1,2,3].map(i=>chip({x:2+i*3,y:1.5,w:1,h:1.6,r:3,fill:C(.1),stroke:C(.4)}))] },\n  { id:'GB-L07', num:'07', short:'POWER', name:'Power Delivery', tag:'VRM · 48 V Bus', ix:0, iy:0, thick:8,\n    desc:'Rows of voltage regulators along the module edges step the rack\\u2019s 48 V bus down to core voltages, feeding hundreds of amps into each die with minimal loss.',\n    specs:[{k:'Input',v:'48 V DC Bus'},{k:'Regulation',v:'Multi-Phase VRM'},{k:'Current',v:'Hundreds Of Amps'},{k:'Telemetry',v:'Per-Rail Monitoring'}],\n    chips:[chip({x:0.5,y:1,w:99,h:98,fill:'transparent',stroke:C(.12)}),\n      ...Array.from({length:9},(_,i)=>chip({x:26.5+i*6.4,y:1.5,w:5,h:5,fill:C(.16),stroke:C(.6)})),\n      ...Array.from({length:9},(_,i)=>chip({x:26.5+i*6.4,y:93.5,w:5,h:5,fill:C(.16),stroke:C(.6)})),\n      ...Array.from({length:3},(_,i)=>chip({x:20.5,y:10+i*28,w:3.5,h:22,fill:C(.14),stroke:C(.6),temp:T.vrm+i})),\n      ...Array.from({length:3},(_,i)=>chip({x:88,y:10+i*28,w:3,h:22,fill:C(.14),stroke:C(.6),temp:T.vrm-1+i})),\n      ...Array.from({length:12},(_,i)=>chip({x:56+(i%2)*1.2,y:12+Math.floor(i/2)*13,w:0.9,h:9,fill:C(.1),stroke:C(.4)})),\n      chip({x:9,y:3,w:6,h:5,fill:C(.1),stroke:C(.5),label:'PMIC'})] },\n  { id:'GB-L08', num:'08', short:'NVLINK-C2C', name:'NVLink 5 Connectors & NVLink-C2C', tag:'Interconnect · 5th-Gen NVLink', ix:0, iy:0, thick:5,\n    desc:'Fifth-generation NVLink leaves the board through the four connectors on the right edge that mate with the rack\\u2019s cable cartridges, while NVLink-C2C fuses each Blackwell GPU to the 72-core Grace CPU with a coherent 900 GB/s link.',\n    specs:[{k:'NVLink 5',v:'1.8 TB/s / GPU'},{k:'NVLink-C2C',v:'900 GB/s'},{k:'Grace CPU',v:'72 Arm Neoverse V2'},{k:'CPU Memory',v:'Up To 480 GB LPDDR5X'}],\n    chips:[chip({x:0.5,y:1,w:99,h:98,fill:'transparent',stroke:C(.12)}),\n      chip({x:12,y:49.2,w:78,h:1.6,fill:C(.6),stroke:'transparent',shadow:'0 0 8px '+C(.6)}),\n      chip({x:12,y:44,w:0.6,h:12,fill:C(.6),stroke:'transparent'}),chip({x:40.5,y:44,w:0.6,h:12,fill:C(.6),stroke:'transparent'}),chip({x:72.5,y:44,w:0.6,h:12,fill:C(.6),stroke:'transparent'}),\n      chip({x:14,y:38,w:20,h:8,label:'NVLINK-C2C · 900 GB/s',fill:'transparent',stroke:'transparent'}),\n      ...NVL.map((n,i)=>chip(n,{fill:O(.22),stroke:O(.9),shadow:'0 0 10px '+O(.4),textColor:'#ffd2b8',label:'NVLINK 5',temp:T.nvl+i})),\n      ...[0,1].flatMap(g=>[0,1,2,3].map(i=>chip({x:PKG[g].x+PKG[g].w*0.5,y:NVL[i].y+NVL[i].h/2,w:91.5-(PKG[g].x+PKG[g].w*0.5),h:0.6,fill:O(.35),stroke:'transparent'}))),\n      chip({x:1,y:30,w:2.5,h:40,fill:C(.15),stroke:C(.5)})] },\n];\n\nconst PARTS = [\n  [['0x00','Copper Cold Plate ×2','Cu'],['0x01','Coolant Manifold In/Out','45 °C In'],['0x02','Thermal Interface (TIM)','Liquid Metal'],['0x03','NVL72 Rack Loop','120 kW']],\n  [['0x10','Blackwell Die 0 / 1','~104 B Tr Each'],['0x11','NV-HBI Die Bridge','10 TB/s'],['0x12','Die Area (Pair)','~1,600 mm²'],['0x13','Grace CPU','72 × Neoverse V2']],\n  [['0x20','Tensor Cores','5th Gen · FP4/FP6'],['0x21','Transformer Engine','v2 · Micro-Scaling'],['0x22','Decompression Engine','800 GB/s'],['0x23','RAS Engine','Predictive']],\n  [['0x30','HBM3e Stacks','8 / GPU · 4 / Die'],['0x31','Per Stack','24 GB · 1 TB/s'],['0x32','Bus Width','8 × 1024-bit'],['0x33','LPDDR5X (Grace)','Up To 480 GB']],\n  [['0x40','CoWoS-L Interposer','Per GPU'],['0x41','LSI Bridge Chiplets','Die ↔ Die · Die ↔ HBM'],['0x42','Micro-Bumps','µm Pitch'],['0x43','RDL Layers','Fine Wiring']],\n  [['0x50','Organic Substrate ×3','Build-Up Laminate'],['0x51','BGA Ball Field','To Module PCB'],['0x52','Module PCB','Multi-Layer'],['0x53','Signal Fabric','NVLink · C2C · PCIe 6']],\n  [['0x60','Input Bus','48 V DC'],['0x61','VRM Phases','Edge Rows ×2'],['0x62','Core Rails','Sub-1 V · 100s A'],['0x63','Telemetry','Per-Rail']],\n  [['0x70','NVLink 5 Connectors','×4 · 1.8 TB/s / GPU'],['0x71','NVLink-C2C ×2','900 GB/s Each'],['0x72','PCIe Gen 6','×2 · 256 GB/s'],['0x73','NVLink Domain','72 GPU · 130 TB/s']],\n].map(l=>l.map(([addr,name,v])=>({addr,name,v})));\nconst h = React.createElement;\nclass Component extends DCLogic {\n  state = { explode: 55, hover: -1, selected: -1, stageW: 600, stageH: 500, rootW: 1200, tick: 0 };\n  reticleEl = null;\n  stageRef = React.createRef(); rootRef = React.createRef();\n  componentDidMount(){\n    try{ const s=JSON.parse(localStorage.getItem('gb200-breakdown')||'{}'); if(typeof s.explode==='number') this.setState({explode:s.explode, selected: s.selected ?? -1}); }catch(e){}\n    this.tm = setInterval(()=>this.setState(s=>({tick:s.tick+1})), 1400);\n    const el = this.stageRef.current;\n    if (el && window.ResizeObserver) {\n      this.ro = new ResizeObserver(([e]) => this.setState({stageW: e.contentRect.width, stageH: e.contentRect.height}));\n      this.ro.observe(el);\n      if (this.rootRef.current) { this.ro2 = new ResizeObserver(([e]) => this.setState({rootW: e.contentRect.width})); this.ro2.observe(this.rootRef.current); }\n    }\n  }\n  componentWillUnmount(){ if (this.ro) this.ro.disconnect(); if (this.ro2) this.ro2.disconnect(); clearInterval(this.tm); }\n  reticle(on){\n    if (!this.reticleEl) {\n      const ring=(sz,dash,anim,op,extra={})=>h('div',{style:{position:'absolute',left:'50%',top:'50%',width:sz,height:sz,marginLeft:-sz/2,marginTop:-sz/2,borderRadius:'50%',border:`1px ${dash} rgba(127,227,245,${op})`,animation:anim,...extra}});\n      this.reticleEl = h('div',{key:'ret',style:{position:'absolute',left:'50%',top:'52%',width:0,height:0,pointerEvents:'none',transform:'rotateX(58deg)',transformStyle:'preserve-3d'}},\n        ring(560,'dashed','spin 40s linear infinite',.18),\n        ring(500,'solid','spinr 28s linear infinite',.10,{borderTopColor:'rgba(127,227,245,.55)',borderBottomColor:'rgba(127,227,245,.55)'}),\n        ring(440,'dotted','spin 60s linear infinite',.22),\n        h('div',{style:{position:'absolute',left:'50%',top:'50%',width:520,height:520,marginLeft:-260,marginTop:-260,borderRadius:'50%',background:'conic-gradient(from 0deg, rgba(127,227,245,.16) 0deg, rgba(127,227,245,0) 70deg, rgba(127,227,245,0) 360deg)',animation:'sweep 6s linear infinite',maskImage:'radial-gradient(circle, transparent 38%, #000 40%)',WebkitMaskImage:'radial-gradient(circle, transparent 38%, #000 40%)'}}),\n        ...[0,90,180,270].map(a=>h('div',{key:a,style:{position:'absolute',left:'50%',top:'50%',width:1,height:34,marginTop:-292,background:'rgba(127,227,245,.5)',transform:`rotate(${a}deg)`,transformOrigin:'0 292px'}}))\n      );\n    }\n    return h('div',{style:{position:'absolute',inset:0,pointerEvents:'none',opacity:on?1:.55,transition:'opacity .4s'}},this.reticleEl);\n  }\n  persist(){ localStorage.setItem('gb200-breakdown', JSON.stringify({explode:this.state.explode, selected:this.state.selected})); }\n  renderVals() {\n    const { explode, hover, selected, stageW, stageH, rootW } = this.state;\n    const narrow = rootW < 1100;\n    const showLabels = stageW > 640;\n    // projected footprint of the 480×300 module at rotateZ(-32) rotateX(58)\n    const footW = 660 + (showLabels ? 150 : 0);\n    const gapPx = 8 + explode * 0.62, totalPx = gapPx * (LAYERS.length - 1);\n    const footH = 300 + totalPx * 0.85;\n    const stageScale = Math.max(0.3, Math.min(1.15, (stageW + 40) / footW, (stageH - 40) / footH));\n    const active = selected >= 0 ? selected : hover;\n    const n = LAYERS.length;\n    const gap = gapPx, total = totalPx;\n    const layers = LAYERS.map((l,i)=>{\n      const on = active === i, sel = selected === i;\n      return { ...l,\n        hover: () => this.setState({hover:i}),\n        select: () => { this.setState(s=>({selected: s.selected===i ? -1 : i}), ()=>this.persist()); },\n        borderColor: on ? A : 'rgba(127,227,245,.18)',\n        bg: on ? 'rgba(127,227,245,.06)' : 'transparent',\n        numColor: on ? A : '#5d6f77', nameColor: on ? '#ffffff' : (selected>=0 && !sel ? '#6f8189' : '#c7d4d9'),\n      };\n    });\n    const plates = LAYERS.map((l,i)=>{\n      const on = active === i, sel = selected === i, dim = selected >= 0 && !sel;\n      let z = total/2 - i*gap;\n      if (sel) z += 0;\n      const tk = this.state.tick;\n      const chips = l.chips.map((c,ci) => {\n        const fits = (len)=> c.w * 4.8 * stageScale >= len * 5.2 + 6 && stageScale >= 0.7;\n        const tv = c.temp==null ? null : c.temp + Math.sin(tk*0.9 + ci)*0.8 + explode*0.01;\n        const hot = tv!=null && tv>=70;\n        return { ...c,\n          label: fits(c.label.length) ? c.label : '',\n          tempLabel: tv==null ? '' : tv.toFixed(1)+'°',\n          tempColor: hot ? '#ffb287' : '#bff3fb',\n          tempOpacity: tv!=null && on && c.w * 4.8 * stageScale >= 24 ? 1 : 0,\n          stroke: hot && on ? O(.85) : c.stroke,\n          shadow: hot && on ? '0 0 10px '+O(.4) : c.shadow };\n      });\n      return { ...l, chips,\n        hover: layers[i].hover, select: layers[i].select,\n        z: sel ? z + 40 : z,\n        opacity: dim ? 0.18 : 1,\n        stroke: on ? A : 'rgba(127,227,245,.42)',\n        chipStroke: on ? 'rgba(191,243,251,.9)' : 'rgba(127,227,245,.35)',\n        fill: on ? 'rgba(127,227,245,.10)' : 'rgba(127,227,245,.035)',\n        side: on ? 'rgba(127,227,245,.22)' : 'rgba(127,227,245,.08)',\n        glow: on ? `0 0 28px rgba(127,227,245,.45), 0 0 2px ${A} inset` : '0 0 0 rgba(0,0,0,0)',\n        labelColor: on ? A : 'rgba(143,163,171,.7)',\n        labelOpacity: !showLabels || dim ? 0 : (explode > 25 || on ? 1 : 0),\n      };\n    });\n    const ai = active >= 0 ? active : 1;\n    const temps = LAYERS[ai].chips.map(c=>c.temp).filter(v=>v!=null);\n    const tMin = temps.length ? Math.min(...temps) : null, tMax = temps.length ? Math.max(...temps) : null;\n    const act = { ...LAYERS[ai], parts: PARTS[ai],\n      thermal: tMin==null ? '—' : (tMin===tMax ? `${tMax} °C` : `${tMin}–${tMax} °C`),\n      thermalPct: tMax==null ? 0 : Math.round(Math.min(100, (tMax-30)/60*100)),\n      thermalEnd: tMax!=null && tMax>=70 ? 'rgba(255,138,76,.9)' : 'rgba(127,227,245,.95)' };\n    const t = this.state.tick;\n    const tel = { temp: (61 + Math.sin(t*0.7)*2.4 + explode*0.02).toFixed(1), bw: (6.2 + Math.sin(t*1.3)*0.9 + (active===3?1.1:0)).toFixed(2) };\n    return {\n      tel,\n      layers, plates, explode, explodePct: explode,\n      axisH: total + 120, stageShift: 10, stageShiftX: 30, stageScale, stageRef: this.stageRef, rootRef: this.rootRef,\n      gridCols: narrow ? 'minmax(180px,240px) minmax(220px,1fr) minmax(150px,200px)' : 'minmax(220px,300px) minmax(260px,1fr) minmax(180px,260px)',\n      gridRows: 'auto minmax(360px,1fr) auto',\n      gridGap: narrow ? '0 12px' : '0 20px',\n      stageArea: '2 / 2 / 3 / 3',\n      indexArea: '2 / 3 / 3 / 4',\n      panelArea: '2 / 1 / 3 / 2',\n      stageMinH: 360, panelPad: narrow ? '16px 14px 14px' : '22px 22px 20px',\n      modeLabel: selected>=0 ? 'Isolate' : (hover>=0 ? 'Inspect' : 'Auto'),\n      active: { ...act, status: selected>=0 ? 'Locked' : (hover>=0 ? 'Hover' : 'Idle') },\n      hasSelection: selected>=0, noSelection: selected<0,\n      panelBorder: active>=0 ? 'rgba(127,227,245,.6)' : 'rgba(127,227,245,.25)',\n      panelGlow: active>=0 ? '0 0 40px rgba(127,227,245,.12)' : 'none',\n      unhover: () => this.setState({hover:-1}),\n      clearSelection: () => this.setState({selected:-1}, ()=>this.persist()),\n      onSlide: e => this.setState({explode:+e.target.value}, ()=>this.persist()),\n      onWheel: e => { const d = Math.sign(e.deltaY) * 6; this.setState(s=>({explode: Math.max(0, Math.min(100, s.explode + d))}), ()=>this.persist()); },\n      ticks: Array.from({length:21},(_,i)=>({h: i%5===0 ? 10 : 5})),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
